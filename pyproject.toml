[project]
name = "agent-context-builder"
version = "0.1.0"
description = "A map-reduce pipeline that transforms a source directory tree of text and binary files into a structured, summarized, and indexed knowledge base. Designed for agent-driven execution with resumability, incremental updates, and full audit logging. "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.100.0",
    "click>=8.3.3",
    "openpyxl>=3.1.5",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "rich>=15.0.0",
]

[project.scripts]
ingest = "ingest_pipeline.cli:ingest"
ingest-add = "ingest_pipeline.cli:ingest_add"
ingest-amend = "ingest_pipeline.cli:ingest_amend"
extract-doc = "ingest_pipeline.extract_doc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
